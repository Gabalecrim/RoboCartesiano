; Pick and Place cartesiano - ESP32
;
; Dois ambientes:
;   esp32dev -> firmware que vai para a placa      (pio run -e esp32dev -t upload)
;   native   -> testes da lógica rodando no PC     (pio test -e native)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:native]
platform = native
test_framework = unity
build_flags = -Wall -Wextra
; "encoder" e "stepper" dependem do Arduino/ESP32, então não entram no teste do PC
lib_ignore = encoder, stepper
